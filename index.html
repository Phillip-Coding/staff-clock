<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Clock Station</title>
  <style>
    body {
      background-color: #1a1d20;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .clock-container {
      text-align: center;
      margin-bottom: 25px;
    }
    
    .time-display {
      font-size: 2.2rem;
      font-weight: 600;
      color: #90caf9;
      letter-spacing: 1px;
    }
    
    .pin-display-container {
      background-color: #373b3e;
      width: 280px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
    }
    
    .pin-display {
      font-size: 1.8rem;
      letter-spacing: 8px;
      font-weight: bold;
      color: #ffffff;
    }
    
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 280px;
    }
    
    .key-btn {
      background-color: #64b5f6;
      color: #0d47a1;
      border: none;
      border-radius: 50%;
      width: 75px;
      height: 75px;
      font-size: 1.6rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
      user-select: none;
    }
    
    .key-btn:active {
      transform: scale(0.95);
      background-color: #42a5f5;
    }
    
    .key-btn.del {
      background-color: #e57373;
      color: #b71c1c;
      border-radius: 18px;
    }
    .key-btn.del:active { background-color: #ef5350; }
    
    .key-btn.ok {
      background-color: #81c784;
      color: #1b5e20;
      border-radius: 18px;
    }
    .key-btn.ok:active { background-color: #66bb6a; }

    .key-btn.bio {
      background-color: #ffb74d;
      color: #e65100;
      border-radius: 8px;
      width: 100%;
      height: 50px;
      font-size: 1.1rem;
    }
    .key-btn.bio:active { background-color: #ffa726; }
    
    .status-panel {
      margin-top: 25px;
      width: 280px;
      min-height: 40px;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.4;
      color: #90caf9;
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <div id="live-clock" class="time-display">00:00:00 AM</div>
  </div>

  <div class="pin-display-container">
    <div id="pin-dots" class="pin-display">----</div>
  </div>

  <div class="keypad-grid">
    <button class="key-btn" onclick="pressNum('1')">1</button>
    <button class="key-btn" onclick="pressNum('2')">2</button>
    <button class="key-btn" onclick="pressNum('3')">3</button>
    
    <button class="key-btn" onclick="pressNum('4')">4</button>
    <button class="key-btn" onclick="pressNum('5')">5</button>
    <button class="key-btn" onclick="pressNum('6')">6</button>
    
    <button class="key-btn" onclick="pressNum('7')">7</button>
    <button class="key-btn" onclick="pressNum('8')">8</button>
    <button class="key-btn" onclick="pressNum('9')">9</button>
    
    <button class="key-btn del" onclick="pressDel()">DEL</button>
    <button class="key-btn" onclick="pressNum('0')">0</button>
    <button class="key-btn ok" onclick="submitPin()">OK</button>
  </div>

  <!-- Biometric Buttons below the numerical pad -->
  <div style="margin-top: 25px; display: flex; gap: 15px; width: 280px;">
    <button class="key-btn bio" id="reg-btn">🔗 Register</button>
    <button class="key-btn bio" id="scan-btn" style="background-color: #26a69a; color: #004d40;">🔑 Scan</button>
  </div>

  <div id="status" class="status-panel">Enter your PIN or use biometrics to continue.</div>

  <script>
    // ⚠️ PASTE YOUR SECURE GOOGLE APPS SCRIPT WEB APP URL HERE
    const GOOGLE_API_URL = "https://google.com";

    let currentPin = "";
    const pinDots = document.getElementById("pin-dots");
    const statusEl = document.getElementById("status");

    // 1. Live Clock Engine
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      document.getElementById("live-clock").innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. PIN Pad Logics
    function pressNum(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        renderPin();
      }
    }
    function pressDel() {
      currentPin = currentPin.slice(0, -1);
      renderPin();
    }
    function renderPin() {
      let mask = "";
      for(let i=0; i<4; i++) {
        mask += i < currentPin.length ? "*" : "-";
      }
      pinDots.innerText = mask;
    }
    
    function submitPin() {
      if(currentPin.length < 4) {
        showStatus("❌ Enter a complete 4-digit PIN.", "#e57373");
        return;
      }
      sendDataToGoogle(currentPin, "PIN Code Entry");
      currentPin = "";
      renderPin();
    }

    function showStatus(msg, color = "#90caf9") {
      statusEl.innerText = msg;
      statusEl.style.color = color;
    }

    // 3. Central Transmitter out to Google Sheets Backend API Hook
    async function sendDataToGoogle(empId, actionType) {
      showStatus("🔄 Sending log data to Google Sheets...", "#90caf9");
      try {
        await fetch(GOOGLE_API_URL, {
          method: "POST",
          mode: "no-cors", // Prevents cross-origin failures safely
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ employeeId: empId, type: actionType })
        });
        showStatus("✅ Successfully logged to Google Sheets!", "#81c784");
      } catch(err) {
        showStatus("❌ Sheet logging update failed: " + err.message, "#e57373");
      }
    }

    // 4. Biometric WebAuthn Code Structure (Adjusted explicitly for Huawei tablet platforms)
    document.getElementById("reg-btn").addEventListener("click", async () => {
      if (!window.PublicKeyCredential) { showStatus("❌ Browser blocks WebAuthn.", "#e57373"); return; }
      showStatus("🔄 Touch tablet fingerprint scanner...", "#ffb74d");
      
      const options = {
        challenge: Uint8Array.from("secure-challenge-token", c => c.charCodeAt(0)),
        rp: { name: "Clock System", id: window.location.hostname },
        user: { id: Uint8Array.from("123", c => c.charCodeAt(0)), name: "staff", displayName: "Staff" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        attestation: "none", // Bypasses brand verification errors
        authenticatorSelection: { 
          userVerification: "discouraged" // Stops tablet hardware from aborting instantly
        },
        timeout: 60000
      };

      try {
        const credential = await navigator.credentials.create({ publicKey: options });
        sendDataToGoogle(credential.id.substring(0,8), "Fingerprint Registration");
      } catch (err) {
        showStatus("❌ Registration failed: " + err.message, "#e57373");
      }
    });

    document.getElementById("scan-btn").addEventListener("click", async () => {
      if (!window.PublicKeyCredential) { showStatus("❌ Browser blocks WebAuthn.", "#e57373"); return; }
      showStatus("🔄 Place finger on scanner to Clock In...", "#26a69a");
      
      const options = { 
        challenge: Uint8Array.from("secure-challenge-token", c => c.charCodeAt(0)), 
        timeout: 60000 
      };
      
      try {
        const assertion = await navigator.credentials.get({ publicKey: options });
        sendDataToGoogle(assertion.id.substring(0,8), "Employee Clock-In");
      } catch (err) {
        showStatus("❌ Scan cancelled or failed.", "#e57373");
      }
    });
  </script>
</body>
</html>
